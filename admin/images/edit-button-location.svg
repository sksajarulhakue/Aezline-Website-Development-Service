<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8fafc" />
  
  <!-- Table Header -->
  <rect x="50" y="50" width="700" height="50" fill="#f1f5f9" rx="5" ry="5" />
  <text x="80" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#334155">Title</text>
  <text x="300" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#334155">Category</text>
  <text x="450" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#334155">Date</text>
  <text x="550" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#334155">Status</text>
  <text x="650" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#334155">Actions</text>
  
  <!-- Table Row 1 -->
  <rect x="50" y="110" width="700" height="60" fill="white" rx="5" ry="5" stroke="#e2e8f0" stroke-width="1" />
  <text x="80" y="145" font-family="Arial" font-size="14" fill="#334155">The Critical Role of Web Performance...</text>
  <text x="300" y="145" font-family="Arial" font-size="14" fill="#334155">Development</text>
  <text x="450" y="145" font-family="Arial" font-size="14" fill="#334155">April 15, 2024</text>
  
  <!-- Status Badge -->
  <rect x="550" y="130" width="80" height="30" fill="#dcfce7" rx="15" ry="15" />
  <text x="590" y="150" font-family="Arial" font-size="12" fill="#166534" text-anchor="middle">Published</text>
  
  <!-- Action Buttons -->
  <rect x="650" y="125" width="90" height="40" fill="#3b82f6" rx="8" ry="8" />
  <text x="695" y="150" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Edit</text>
  
  <!-- Table Row 2 -->
  <rect x="50" y="180" width="700" height="60" fill="white" rx="5" ry="5" stroke="#e2e8f0" stroke-width="1" />
  <text x="80" y="215" font-family="Arial" font-size="14" fill="#334155">Designing for Accessibility...</text>
  <text x="300" y="215" font-family="Arial" font-size="14" fill="#334155">Design</text>
  <text x="450" y="215" font-family="Arial" font-size="14" fill="#334155">April 8, 2024</text>
  
  <!-- Status Badge -->
  <rect x="550" y="200" width="80" height="30" fill="#dcfce7" rx="15" ry="15" />
  <text x="590" y="220" font-family="Arial" font-size="12" fill="#166534" text-anchor="middle">Published</text>
  
  <!-- Action Buttons -->
  <rect x="650" y="195" width="90" height="40" fill="#3b82f6" rx="8" ry="8" />
  <text x="695" y="220" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Edit</text>
  
  <!-- Highlight -->
  <rect x="645" y="120" width="100" height="50" fill="none" stroke="#ef4444" stroke-width="3" rx="10" ry="10" />
  <rect x="645" y="190" width="100" height="50" fill="none" stroke="#ef4444" stroke-width="3" rx="10" ry="10" />
  
  <!-- Arrow pointing to edit button -->
  <path d="M 750,145 L 780,145 L 780,100 L 790,100" stroke="#ef4444" stroke-width="3" fill="none" />
  <text x="795" y="105" font-family="Arial" font-size="16" font-weight="bold" fill="#ef4444">Edit Button</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#334155" text-anchor="middle">Admin Blog Management Page</text>
  <text x="400" y="350" font-family="Arial" font-size="16" fill="#334155" text-anchor="middle">The Edit buttons are highlighted in red</text>
  <text x="400" y="380" font-family="Arial" font-size="16" fill="#334155" text-anchor="middle">They are only visible in the admin dashboard</text>
</svg>
